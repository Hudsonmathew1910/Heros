{% comment %}Feature switcher shared by Heros Chat / Infinsight / Zuno — like Codex · Claude Code · Cowork.{% endcomment %}

    <i class="fa-regular fa-comment"></i><span class="sb-label">Chat</span>

  <a href="{% url 'infinsight_home' %}" class="sb-item{% if active == 'infinsight' %} active{% endif %}" data-tip="Infinsight" data-tip-pos="right">

  <a href="{% url 'zuno_index' %}" class="sb-item{% if active == 'zuno' %} active{% endif %}" data-tip="Zuno" data-tip-pos="right">
