{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Heros{% endblock %}</title>
  <meta name="description" content="{% block description %}Heros is your intelligent AI assistant — chat, code, search the web, analyze data and talk naturally.{% endblock %}" />
  <meta name="theme-color" content="#353B30" />
  <link rel="icon" type="image/png" href="{% static 'images/Hero_ai.png' %}" />
  <link rel="apple-touch-icon" href="{% static 'images/Hero_ai.png' %}" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('hero-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="{% static 'heros/css/tokens.css' %}" />
  <link rel="stylesheet" href="{% static 'heros/css/base.css' %}" />
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <script src="{% static 'heros/js/shell.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
